            .panel-title {

                font-weight: 600;
                text-transform: uppercase;

                padding-bottom: 6px;
                margin-bottom: 10px;

            .brand-section {
                margin-bottom: 12px;
                flex-shrink: 0;
            }
            .brand-title {
                font-family: 'Oswald', sans-serif;
                font-size: 40px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 1px;
                color: #ffffff;
                line-height: 1.1;
            }
            .brand-subtitle {
                font-size: 13px;
                font-weight: 600;
                color: #CC2E40;
                letter-spacing: 1.5px;
                text-transform: uppercase;
                margin-top: 2px;
            }
            .brand-date {
                font-size: 15px;
                color: #ffffff;
                margin-top: 2px;
            }
            
            .metric-stack {
                display: flex;
                flex-direction: column;
                gap: 10px;
                margin-bottom: 12px;
                flex-shrink: 0;
            }
            .metric-card {
                background: #090909;
                border-left: 4px solid #73000A;
                border-right: 1px solid #1e1e1e;
                border-top: 1px solid #1e1e1e;
                border-bottom: 1px solid #151515;
                padding: 8px 12px;
                border-radius: 2px;
            }
            .metric-label {
                font-family: 'Oswald', sans-serif;
                font-size: 17px;
                font-weight: 600;
                color: #777777;
                text-transform: uppercase;
                letter-spacing: 1px;
            }
            .metric-value {
                font-family: 'Oswald', sans-serif;
                font-size: 60px;
                font-weight: 700;
                color: #ffffff;
                line-height: 1.1;
                margin-top: 1px;
            }
            
            .wordcloud-container {
                width: 600px;
                height: 287px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #000000;
                border: 1px solid #1a1a1a;
                border-radius: 2px;
                overflow: hidden;
                margin: 0 auto;
            }
            .wordcloud-img {
                width: 100%;
                height: 100%;
                object-fit: contain;
            }
            
            .headline-card {
                flex: 1;
                display: flex;
                flex-direction: column;
                height: 100%;
                position: relative;
            }
            
            @keyframes nudge-animation {
                0% { filter: blur(0px); opacity: 1; transform: scale(1); }
                20% { filter: blur(4px); opacity: 0.8; transform: scale(0.995); }
                100% { filter: blur(0px); opacity: 1; transform: scale(1); }
            }
            .nudge {
                animation: nudge-animation 0.5s ease-in-out;
            }
            
            @keyframes slide-animation {
                0% { transform: translateX(0); opacity: 1; filter: blur(0px); }
                30% { transform: translateX(-80px); opacity: 0; filter: blur(2px); }
                35% { transform: translateX(80px); opacity: 0; filter: blur(2px); }
                100% { transform: translateX(0); opacity: 1; filter: blur(0px); }
            }
            .slide-effect {
                animation: slide-animation 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
            }
            
            @keyframes slide-up-animation {
                0% { transform: translateY(0); opacity: 1; filter: blur(0px); }
                30% { transform: translateY(-60px); opacity: 0; filter: blur(2px); }
                35% { transform: translateY(60px); opacity: 0; filter: blur(2px); }
                100% { transform: translateY(0); opacity: 1; filter: blur(0px); }
            }
            .slide-up-effect {
                animation: slide-up-animation 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
            }
            
            .headline-image-wrap {
                width: 100%;
                height: 350px;
                border-radius: 4px;
                overflow: hidden;
                border: 1px solid #222222;
                background: #090909;
                flex-shrink: 0;
                margin-bottom: 12px;
            }
            .headline-img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

                font-weight: 700;
                color: #ffffff;
                line-height: 1.25;

                flex-shrink: 0;

            .headline-meta {
                font-size: 18px;
                font-weight: 700;
                color: #CC2E40;
                text-transform: uppercase;
                letter-spacing: 1px;
                margin-bottom: 8px;
                flex-shrink: 0;
            }
            
            .headline-desc {
                font-size: 21px;
                line-height: 1.55;
                color: #cccccc;
                overflow: hidden;
                display: -webkit-box;
                -webkit-line-clamp: 7;
                -webkit-box-orient: vertical;
                flex-grow: 1;
            }
            
            .topics-scroll {
                flex: 1;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                gap: 4px;
            }

                align-items: center;
                margin: 2px 0;
                gap: 8px;
                border-radius: 2px;
                padding: 2px 4px;
                transition: all 0.3s ease;
            }
            .progress-label {
                width: 110px;
                font-size: 18px;
                font-weight: 600;
                color: #e0e0e0;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .progress-bar-wrap {
                flex: 1;
                background: #1a1a1a;
                height: 12px;
                border-radius: 2px;
                overflow: hidden;
            }
            .progress-bar {
                height: 100%;
                background: linear-gradient(90deg, #73000A, #CC2E40);
                border-radius: 2px;
            }
            .progress-count {
                width: 40px;
                text-align: right;
                font-size: 17px;
                font-weight: 700;
                color: #888888;
            }
            
            .country-row-highlighted {
                background: rgba(204, 46, 64, 0.25) !important;
                border-left: 3px solid #CC2E40;
                padding-left: 6px !important;
            }
            .country-row-highlighted .progress-label {
                color: #FFE23E !important;
                font-weight: 800 !important;
            }
            
            #map-element {
                flex: 1;
                width: 100%;
                background: #090909;
                border-radius: 4px;
                border: 1px solid #1a1a1a;
            }
        </style>

            </div>

                if (h.image && h.image.length > 5) {
                    img.src = h.image;
                    imgWrap.style.display = "block";
                } else {
                    imgWrap.style.display = "none";
                }

                currentIndex++;
            }

            // ── Independent country highlight loop ───────────────────────
            // Shuffle helper (Fisher-Yates)
            function shuffleArray(arr) {
                const a = [...arr];
                for (let i = a.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [a[i], a[j]] = [a[j], a[i]];
                }
                return a;
            }

            let countryQueue = [];
            let countryQueueIndex = 0;

            function refillCountryQueue() {
                countryQueue = shuffleArray(countries.slice(0, numCountries));
                countryQueueIndex = 0;
            }
            refillCountryQueue();

            function rotateCountryHighlight() {
                if (!countries.length) return;

                // Clear previous highlight
                countries.forEach(c => {
                    const el = document.getElementById("country-row-" + c.source_iso3);
                    if (el) el.className = "progress-row";
                });

                // Refill queue when exhausted
                if (countryQueueIndex >= countryQueue.length) refillCountryQueue();

                const c = countryQueue[countryQueueIndex++];

                // Highlight the row
                const el = document.getElementById("country-row-" + c.source_iso3);
                if (el) el.className = "progress-row country-row-highlighted";

                // Draw pulsing dot on map
                if (centroids[c.source_iso3]) {
                    const lon = centroids[c.source_iso3][0];
                    const lat = centroids[c.source_iso3][1];

                    // Animate: two traces cycling opacity to simulate pulse
                    const outerMarker = {
                        type: 'scattergeo',
                        lon: [lon], lat: [lat],
                        mode: 'markers',
                        marker: {
                            size: 38,
                            color: 'rgba(255, 226, 62, 0.25)',
                            line: { color: 'rgba(255,226,62,0.5)', width: 1 },
                            symbol: 'circle'
                        },
                        hoverinfo: 'none'
                    };
                    const innerMarker = {
                        type: 'scattergeo',
                        lon: [lon], lat: [lat],
                        mode: 'markers',
                        marker: {
                            size: 20,
                            color: '#FFE23E',
                            line: { color: '#ffffff', width: 2 },
                            opacity: 0.95,
                            symbol: 'circle'
                        },
                        hoverinfo: 'none'
                    };

                    Plotly.react('map-element', [choroplethTrace, outerMarker, innerMarker], mapLayout);

                    // Pulsate: fade outer ring in/out via quick re-draws
                    let pulseStep = 0;
                    const pulseSizes   = [38, 50, 62, 50, 38];
                    const pulseOpacity = [0.25, 0.15, 0.08, 0.15, 0.25];
                    const pulseTimer = setInterval(() => {
                        if (pulseStep >= pulseSizes.length) {
                            clearInterval(pulseTimer);
                            return;
                        }
                        const animatedOuter = {
                            type: 'scattergeo',
                            lon: [lon], lat: [lat],
                            mode: 'markers',
                            marker: {
                                size: pulseSizes[pulseStep],
                                color: `rgba(255, 226, 62, ${pulseOpacity[pulseStep]})`,
                                line: { color: `rgba(255,226,62,${pulseOpacity[pulseStep] * 2})`, width: 1 },
                                symbol: 'circle'
                            },
                            hoverinfo: 'none'
                        };
                        Plotly.react('map-element', [choroplethTrace, animatedOuter, innerMarker], mapLayout);
                        pulseStep++;
                    }, 220);
                } else {
                    Plotly.react('map-element', [choroplethTrace], mapLayout);
                }
            }

            rotateHeadline();
            setInterval(rotateHeadline, rotationInterval * 1000);

            rotateCountryHighlight();
            setInterval(rotateCountryHighlight, countryHighlightInterval * 1000);

            // Auto-refresh the entire parent page to clear memory/websockets
            setTimeout(function() {
                try {
                    window.parent.location.reload();
                } catch (e) {
                    window.location.reload();
                }
            }, 24 * 60 * 60 * 1000);
        </script>
    </body>
    </html>
